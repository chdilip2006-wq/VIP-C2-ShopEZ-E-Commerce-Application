services:
  - type: web
    runtime: node
    name: shopez-commerce-application
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://shopez-commerce-application.onrender.com
      - key: STRIPE_LIVE_PAYMENTS
        value: false
      - key: STRIPE_CURRENCY
        value: inr
